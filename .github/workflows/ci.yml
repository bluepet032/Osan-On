name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pipeline
        run: python -m pip install -e ".[dev]"
      - name: Lint pipeline
        run: python -m ruff check pipeline tests
      - name: Test pipeline
        run: python -m pytest
      - name: Validate generated data
        run: python -m pipeline.validate

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Lint and unit test
        run: |
          pnpm lint
          pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Firestore security rules
        # Same steps as docs/DEPLOYMENT.md "보안 규칙 검사", outside the project's own dependencies.
        working-directory: ${{ runner.temp }}
        run: |
          echo '{"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}' > firebase.json
          npm init -y > /dev/null
          npm install --legacy-peer-deps firebase-tools @firebase/rules-unit-testing firebase@12
          cp "$GITHUB_WORKSPACE/tests/firestore/rules.test.mjs" .
          RULES_PATH="$GITHUB_WORKSPACE/firestore.rules" npx firebase emulators:exec --only firestore --project demo-questboard "node rules.test.mjs"

