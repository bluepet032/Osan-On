version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node types must match the runtime in .nvmrc / engines (Node 24), not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
