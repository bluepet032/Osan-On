[project]
name = "questboard-pipeline"
version = "1.0.0"
description = "QuestBoard opportunity collection and normalization pipeline"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
  # Windows ships no IANA time zone database, so ZoneInfo("Asia/Seoul") needs this package.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
]

[project.scripts]
questboard = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff.lint]
# Only rules that catch real mistakes: unused or undefined names and syntax errors.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

